<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 72" width="372" height="72" role="img" aria-labelledby="fmp-lockup-title">
  <title id="fmp-lockup-title">Group 02 — AI-Powered BIM Value Engineering Assistant</title>
  <!--
    Team lockup for Group 02's Final Master's Project.
    Mark + rule + two-line signature. This is OUR team lockup, not an official
    Zigurat logo: the wordmark is set in the design system's own typefaces and
    names the team, so it must never be presented as institutional branding.

    Clear space: keep at least 16 units (one mark-step height) clear on all
    sides. Minimum width 180px on screen, 45mm in print — below that use
    zigurat-mark.svg on its own.
  -->

  <!-- Mark: 128x104 scaled to 44 tall -->
  <g transform="translate(0 14) scale(0.42308)">
    <g fill="#1C60F3">
      <path d="M32 0 L64 16 L64 48 L32 32 Z"/>
      <path d="M0 40 L64 72 L64 104 L0 72 Z"/>
    </g>
    <g fill="#41CF97">
      <path d="M96 0 L64 16 L64 48 L96 32 Z"/>
      <path d="M128 40 L64 72 L64 104 L128 72 Z"/>
    </g>
  </g>

  <!-- Divider -->
  <rect x="70" y="16" width="1.5" height="40" fill="#E2E8F0"/>

  <!-- Signature -->
  <text x="88" y="35"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="21" font-weight="700" letter-spacing="-0.3"
        fill="#1B1F23">GROUP 02</text>
  <text x="88" y="52"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="11" font-weight="500" letter-spacing="0.4"
        fill="#4A5568">AI-Powered BIM Value Engineering Assistant</text>
</svg>
