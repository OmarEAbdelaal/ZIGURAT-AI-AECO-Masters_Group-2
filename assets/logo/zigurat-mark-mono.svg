<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 104" width="128" height="104" role="img" aria-labelledby="zigurat-mark-mono-title">
  <title id="zigurat-mark-mono-title">Zigurat mark, single colour</title>
  <!--
    Single-colour variant for one-ink printing, watermarks, embossing, and any
    background where the two-tone mark loses contrast. Inherits the surrounding
    text colour via currentColor, so set `color` on the parent element.
    Set opacity on the .step-light group only if you need the two steps to read
    as separate planes.
  -->
  <g fill="currentColor">
    <path d="M32 0 L64 16 L64 48 L32 32 Z"/>
    <path d="M0 40 L64 72 L64 104 L0 72 Z"/>
  </g>
  <g fill="currentColor" opacity="0.62" class="step-light">
    <path d="M96 0 L64 16 L64 48 L96 32 Z"/>
    <path d="M128 40 L64 72 L64 104 L128 72 Z"/>
  </g>
</svg>
